schema_version: "1.0"
task:
  id: "example-refactor-auth"
  title: "Refactor authentication without changing public behaviour"
  description: >
    Refactor the authentication module, preserve existing public behaviour,
    add targeted tests, and update the relevant documentation.
  risk_tier: "medium"

scope:
  include:
    - "Authentication module internals"
    - "Focused regression tests"
    - "Documentation for changed behaviour"
  exclude:
    - "Public API changes"
    - "Database schema changes"
    - "Unrelated formatting or dependency upgrades"

acceptance_criteria:
  - id: "AC-001"
    statement: "Existing public authentication behaviour is preserved."
    mandatory: true
    evidence:
      - kind: "regression_test"
  - id: "AC-002"
    statement: "New or changed branches have relevant tests."
    mandatory: true
    evidence:
      - kind: "test"
  - id: "AC-003"
    statement: "Relevant documentation reflects the final implementation."
    mandatory: true
    evidence:
      - kind: "diff_review"
  - id: "AC-004"
    statement: "All configured mandatory checks pass on the final revision."
    mandatory: true
    evidence:
      - kind: "command"

required_checks:
  - id: "CHECK-001"
    name: "unit-tests"
    command: ["npm", "test", "--", "--runInBand"]
    mandatory: true
    timeout_seconds: 600
    policy: "project-approved-checks"

constraints:
  - "Do not change public interfaces without explicit contract amendment."
  - "Do not access external services."
  - "Do not add dependencies without explicit approval."

approval:
  scope_change_requires_human: true
  destructive_actions_require_human: true
  external_side_effects_require_human: true

verification:
  mode: "guide"
  max_corrective_cycles: 3
  require_final_revision_match: true

notes:
  - "Illustrative schema only; validate against the implemented schema before use."
  - "Commands are examples and must be adapted to the target repository."
